[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prenomen"
version = "2.0.0"
description = "Infer gender from a personal name, combining name-gender dictionaries with a language model."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Olivier Philippe" }]
keywords = ["gender", "name", "bibliometrics", "llm", "scientometrics"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # 1.92.0 is the first release with chat.completions.parse; before that the
    # structured-output parse helper lived only under client.beta.
    "openai>=1.92",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    # Only for loading the name-gender dictionaries, which run to millions of rows
    # (WGND is 3.8M names): the loaders group and aggregate them vectorised, and
    # row-wise Python there would take far longer. Nothing reads your data.
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
prenomen-dicts = "prenomen.dictionaries:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/prenomen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
